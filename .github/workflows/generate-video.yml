name: Gerar video faceless

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: Tema do video
        required: false
        default: Uma gravacao encontrada em uma casa abandonada
      duration:
        description: Duracao aproximada em segundos
        required: false
        default: '45'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  generate:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[VIDEO]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate secret
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY nao configurada em Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Resolve video request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          MANUAL_DURATION: ${{ github.event.inputs.duration }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            TOPIC=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^TOPIC: //p' | head -n 1)
            DURATION=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^DURATION: //p' | head -n 1)
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TOPIC="$MANUAL_TOPIC"
            DURATION="$MANUAL_DURATION"
          else
            TOPICS=(
              "5 curiosidades do espaco que parecem mentira"
              "Misterios historicos que ainda nao foram explicados"
              "Tecnologias que devem mudar nossa rotina"
              "Curiosidades estranhas sobre o oceano"
              "Lugares abandonados com historias impressionantes"
              "Fatos sobre o corpo humano que pouca gente conhece"
              "Descobertas arqueologicas surpreendentes"
              "Fenomenos naturais raros registrados no mundo"
              "Coisas comuns com origens inesperadas"
              "Historias reais que parecem roteiro de filme"
            )
            INDEX=$(( GITHUB_RUN_NUMBER % ${#TOPICS[@]} ))
            TOPIC="${TOPICS[$INDEX]}"
            DURATION="45"
          fi

          if [ -z "$TOPIC" ]; then
            TOPIC="Uma gravacao encontrada em uma casa abandonada"
          fi

          DURATION=$(printf '%s' "${DURATION:-45}" | tr -cd '0-9')
          if [ -z "$DURATION" ]; then DURATION=45; fi
          if [ "$DURATION" -lt 15 ]; then DURATION=15; fi
          if [ "$DURATION" -gt 90 ]; then DURATION=90; fi

          {
            echo 'TOPIC<<EOF'
            echo "$TOPIC"
            echo 'EOF'
            echo "DURATION=$DURATION"
          } >> "$GITHUB_ENV"

          echo "Tema: $TOPIC"
          echo "Duracao: $DURATION segundos"

      - name: Generate video
        run: node scripts/github-generate.mjs

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-content-video-${{ github.run_number }}
          path: output/ghost-content.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Reply to request
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Vídeo gerado com sucesso.\n\nAbra a execução para baixar o MP4 em **Artifacts**:\n${runUrl}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
